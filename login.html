<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesion · MascotICA's</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="login-wrapper">
    <div class="card login-card p-4">
        <div class="text-center mb-3">
            <i class="bi bi-shop" style="font-size:2.5rem;color:#ff8c42;"></i>
            <h3 class="fw-bold mt-2">MascotICA's</h3>
            <p class="text-muted mb-0">Adopcion y venta de insumos</p>
        </div>

        <div id="mensajeLogin"></div>

        <div id="panelLogin">
            <form id="formLogin">
                <div class="mb-3">
                    <label class="form-label">Correo electronico</label>
                    <input type="email" id="correo" class="form-control" placeholder="correo@ejemplo.com" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" id="password" class="form-control" placeholder="********" required>
                </div>
                <button type="submit" id="btnIngresar" class="btn w-100 text-white" style="background-color:#ff8c42;">
                    <i class="bi bi-box-arrow-in-right"></i> Ingresar
                </button>
            </form>
            <hr>
            <div class="text-center small">
                No tienes cuenta?
                <a href="#" id="linkRegistro">Registrate aqui</a>
            </div>
        </div>

        <div id="panelPin" style="display:none;">
            <p class="small text-muted">
                Enviamos un codigo de 8 digitos a <strong id="correoPin"></strong>.
                Revisa tu bandeja de entrada.
            </p>
            <form id="formPin">
                <div class="mb-3">
                    <label class="form-label">Codigo de verificacion</label>
                    <input type="text" id="codigoPin" class="form-control text-center" maxlength="8" placeholder="00000000" inputmode="numeric" required>
                </div>
                <button type="submit" id="btnVerificar" class="btn w-100 text-white" style="background-color:#ff8c42;">
                    <i class="bi bi-shield-check"></i> Verificar codigo
                </button>
            </form>
            <hr>
            <div class="text-center small">
                <a href="#" id="linkVolverLogin">Volver al inicio de sesion</a>
            </div>
        </div>

        <div id="panelRegistro" style="display:none;">
            <form id="formRegistro">
                <div class="mb-3">
                    <label class="form-label">Nombre completo</label>
                    <input type="text" id="regNombre" class="form-control" placeholder="Juan Perez" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Correo electronico</label>
                    <input type="email" id="regCorreo" class="form-control" placeholder="correo@ejemplo.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" id="regPassword" class="form-control" placeholder="Minimo 6 caracteres" required>
                </div>
                <button type="submit" id="btnRegistrar" class="btn w-100 text-white" style="background-color:#ff8c42;">
                    <i class="bi bi-person-plus"></i> Crear cuenta
                </button>
            </form>
            <hr>
            <div class="text-center small">
                Ya tienes cuenta?
                <a href="#" id="linkVolverLogin2">Inicia sesion</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script>
    const panelLogin = document.getElementById('panelLogin');
    const panelPin = document.getElementById('panelPin');
    const panelRegistro = document.getElementById('panelRegistro');
    const mensaje = document.getElementById('mensajeLogin');
    let correoPendiente = '';

    function mostrar(tipo, texto) {
        const clase = tipo === 'error' ? 'alert-danger' : 'alert-success';
        const icono = tipo === 'error' ? 'bi-x-circle' : 'bi-check-circle';
        mensaje.innerHTML = '<div class="alert ' + clase + ' py-2"><i class="bi ' + icono + '"></i> ' + texto + '</div>';
    }

    function limpiarMensaje() {
        mensaje.innerHTML = '';
    }

    function verPanel(cual) {
        panelLogin.style.display = cual === 'login' ? 'block' : 'none';
        panelPin.style.display = cual === 'pin' ? 'block' : 'none';
        panelRegistro.style.display = cual === 'registro' ? 'block' : 'none';
    }

    (function () {
        const actual = Auth.usuarioActual();
        if (actual) {
            window.location.replace(actual.rol === 'ADMIN' ? 'admin/dashboard.html' : 'cliente/index.html');
        }
    })();

    document.getElementById('linkRegistro').addEventListener('click', function (e) {
        e.preventDefault();
        limpiarMensaje();
        verPanel('registro');
    });

    document.getElementById('linkVolverLogin').addEventListener('click', function (e) {
        e.preventDefault();
        limpiarMensaje();
        verPanel('login');
    });

    document.getElementById('linkVolverLogin2').addEventListener('click', function (e) {
        e.preventDefault();
        limpiarMensaje();
        verPanel('login');
    });

    document.getElementById('formLogin').addEventListener('submit', async function (e) {
        e.preventDefault();
        const boton = document.getElementById('btnIngresar');
        const correo = document.getElementById('correo').value.trim();
        const password = document.getElementById('password').value;

        boton.disabled = true;
        limpiarMensaje();

        const valido = await Auth.validarPassword(correo, password);
        if (!valido) {
            mostrar('error', 'Correo o contrasena incorrectos.');
            boton.disabled = false;
            return;
        }

        const errorPin = await Auth.enviarPin(correo);
        boton.disabled = false;

        if (errorPin) {
            mostrar('error', 'No se pudo enviar el codigo: ' + errorPin);
            return;
        }

        correoPendiente = correo;
        document.getElementById('correoPin').textContent = correo;
        verPanel('pin');
        document.getElementById('codigoPin').focus();
    });

    document.getElementById('formPin').addEventListener('submit', async function (e) {
        e.preventDefault();
        const boton = document.getElementById('btnVerificar');
        const codigo = document.getElementById('codigoPin').value.trim();

        if (!/^\d{8}$/.test(codigo)) {
            mostrar('error', 'El codigo debe tener exactamente 8 digitos.');
            return;
        }

        boton.disabled = true;
        limpiarMensaje();

        const resultado = await Auth.verificarPin(correoPendiente, codigo);

        if (resultado.error) {
            mostrar('error', 'Error de Supabase: ' + resultado.error);
            console.log('Error Supabase:', resultado.error);
            boton.disabled = false;
            return;
        }

        window.location.href = resultado.usuario.rol === 'ADMIN'
            ? 'admin/dashboard.html'
            : 'cliente/index.html';
    });

    document.getElementById('formRegistro').addEventListener('submit', async function (e) {
        e.preventDefault();
        const boton = document.getElementById('btnRegistrar');
        const nombre = document.getElementById('regNombre').value.trim();
        const correo = document.getElementById('regCorreo').value.trim();
        const password = document.getElementById('regPassword').value;

        if (password.length < 6) {
            mostrar('error', 'La contrasena debe tener al menos 6 caracteres.');
            return;
        }

        boton.disabled = true;
        limpiarMensaje();

        const error = await Auth.registrar(nombre, correo, password);
        boton.disabled = false;

        if (error) {
            mostrar('error', error);
            return;
        }

        document.getElementById('formRegistro').reset();
        verPanel('login');
        mostrar('ok', 'Cuenta creada. Ya puedes iniciar sesion.');
    });
</script>
</body>
</html>
