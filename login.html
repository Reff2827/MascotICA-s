<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesion · MascotICA's Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="login-wrapper">
    <div class="card login-card p-4">
        <div class="text-center mb-3">
            <i class="bi bi-shop" style="font-size:2.5rem;color:#ff8c42;"></i>
            <h3 class="fw-bold mt-2">MascotICA's</h3>
            <p class="text-muted mb-0">Adopcion y venta de insumos</p>
        </div>

        <div id="mensajeLogin"></div>

        <form id="formLogin">
            <div class="mb-3">
                <label class="form-label">Correo electronico</label>
                <input type="email" name="correo" id="correo" class="form-control" placeholder="admin@albergue.com" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Contrasena</label>
                <input type="password" name="password" id="password" class="form-control" placeholder="********" required>
            </div>
            <button type="submit" class="btn w-100 text-white" style="background-color:#ff8c42;">
                <i class="bi bi-box-arrow-in-right"></i> Ingresar
            </button>
        </form>

        <hr>
        <div class="small text-muted text-center">
            <strong>Demo</strong><br>
            Admin: admin@albergue.com / admin123<br>
            Cliente: cliente@correo.com / 123456
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabaseClient.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script>
    (function () {
        const actual = Auth.usuarioActual();
        if (actual) {
            window.location.replace(actual.rol === 'ADMIN' ? 'admin/dashboard.html' : 'cliente/index.html');
        }
    })();

    document.getElementById('formLogin').addEventListener('submit', function (e) {
        e.preventDefault();
        const correo = document.getElementById('correo').value.trim();
        const password = document.getElementById('password').value;

        const usuario = Auth.login(correo, password);
        const cont = document.getElementById('mensajeLogin');

        if (!usuario) {
            cont.innerHTML = `<div class="alert alert-danger py-2"><i class="bi bi-x-circle"></i> Correo o contrasena incorrectos.</div>`;
            return;
        }
        window.location.href = usuario.rol === 'ADMIN' ? 'admin/dashboard.html' : 'cliente/index.html';
    });
</script>
</body>
</html>
