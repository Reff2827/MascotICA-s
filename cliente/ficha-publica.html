<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ficha pública · MascotICA's</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet" integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous">

    <link rel="stylesheet" href="../css/styles.css">

    <script src="../js/theme.js"></script>
</head>

<body>

<div id="navbar"></div>

<div class="container-fluid px-4 pb-5">

    <div class="text-center mb-4">
        <h2 class="fw-bold mb-1">MascotICA's</h2>

        <h3 class="fw-bold">
            FICHA PÚBLICA DE ADOPCIÓN
        </h3>

        <p class="text-muted">
            Registro público de una adopción realizada en MascotICA's
        </p>
    </div>


    <div
        class="card border-0 shadow-sm mx-auto"
        style="max-width:850px;">

        <div class="card-body p-4">

            <div
                id="cargando"
                class="text-center py-5">

                <div
                    class="spinner-border text-primary"
                    role="status">
                </div>

                <p class="text-muted mt-3">
                    Cargando ficha...
                </p>

            </div>


            <div
                id="ficha"
                class="d-none">

                <div class="row g-4 align-items-center">

                    <div class="col-md-5 text-center">

                        <img
                            id="fotoMascota"
                            src=""
                            alt="Mascota adoptada"
                            class="img-fluid rounded shadow-sm"
                            style="max-height:320px; width:100%; object-fit:cover;">

                    </div>


                    <div class="col-md-7">

                        <h2
                            id="nombreMascota"
                            class="fw-bold mb-3">
                        </h2>

                        <div class="mb-2">
                            <strong>Especie:</strong>
                            <span id="especieMascota"></span>
                        </div>

                        <div class="mb-2">
                            <strong>Raza / tipo:</strong>
                            <span id="razaMascota"></span>
                        </div>

                        <div class="mb-2">
                            <strong>Edad:</strong>
                            <span id="edadMascota"></span>
                        </div>

                        <div class="mb-3">
                            <strong>Sexo:</strong>
                            <span id="sexoMascota"></span>
                        </div>

                        <hr>

                        <div class="mb-2">
                            <strong>ID de adopción:</strong>
                            <span
                                id="codigoFicha"
                                class="badge bg-primary">
                            </span>
                        </div>

                        <div>
                            <strong>Fecha de adopción:</strong>
                            <span id="fechaAdopcion"></span>
                        </div>

                    </div>

                </div>

            </div>


            <div
                id="sinFicha"
                class="d-none text-center py-5">

                <i class="bi bi-file-earmark-x fs-1 text-muted"></i>

                <h5 class="fw-bold mt-3">
                    Ficha no encontrada
                </h5>

                <p class="text-muted">
                    El código indicado no corresponde a una ficha pública.
                </p>

            </div>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R" crossorigin="anonymous"></script>
<script src="../js/supabaseClient.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>

<script src="../js/cliente/ficha-publica.js"></script>

</body>
</html>
