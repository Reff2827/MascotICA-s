<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis solicitudes · MascotICA's</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<div id="navbar"></div>
<div id="alertas"></div>

<div class="container-fluid px-4 pb-5">
    <h3 class="fw-bold mb-3"><i class="bi bi-list-check"></i> Mis solicitudes</h3>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr><th>Tipo</th><th>Detalle</th><th>Cantidad</th><th>Fecha</th><th>Estado</th></tr>
                </thead>
                <tbody id="filasSolicitudes"></tbody>
            </table>
            <p class="text-muted p-3 mb-0 d-none" id="sinSolicitudes">Aun no has enviado ninguna solicitud.</p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabaseClient.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script>
    const usuario = Auth.requireCliente();
    if (usuario) {
        UI.navbarCliente(usuario);
        UI.mostrarFlash();
        pintarTabla();
    }

    async function pintarTabla() {
        const solicitudes = await Solicitudes.listarPorUsuario(usuario.idUsuario);
        const descripciones = await Promise.all(solicitudes.map(s => Solicitudes.descripcion(s)));
        const tbody = document.getElementById('filasSolicitudes');
        document.getElementById('sinSolicitudes').classList.toggle('d-none', solicitudes.length > 0);

        tbody.innerHTML = solicitudes.map((s, i) => `
            <tr>
                <td>${s.tipo === 'ADOPCION'
                    ? '<span class="text-danger"><i class="bi bi-heart-fill"></i> Adopcion</span>'
                    : '<span class="text-primary"><i class="bi bi-cart-fill"></i> Compra</span>'}</td>
                <td>${UI.esc(descripciones[i])}</td>
                <td>${s.cantidad}</td>
                <td>${UI.formatoFecha(s.fecha)}</td>
                <td><span class="badge badge-estado-${s.estado}">${s.estado}</span></td>
            </tr>`).join('');
    }
</script>
</body>
</html>
