<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis solicitudes · MascotICA's</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/theme.js"></script>
</head>
<body>

<div id="navbar"></div>
<div id="alertas"></div>

<div class="container-fluid px-4 pb-5">

    <h3 class="fw-bold mb-4">
        <i class="bi bi-list-check"></i>
        Mis solicitudes
    </h3>

    <section class="mb-5">
        <h4 class="fw-bold mb-3">
            <i class="bi bi-heart-fill text-danger"></i>
            Mis adopciones
        </h4>

        <div class="card border-0 shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Mascota</th>
                        <th>Fecha de solicitud</th>
                        <th>Estado</th>
                        <th>Ficha y recomendaciones</th>
                    </tr>
                    </thead>
                    <tbody id="filasSolicitudes"></tbody>
                </table>

                <p class="text-muted p-3 mb-0 d-none" id="sinSolicitudes">
                    Aún no has enviado solicitudes de adopción.
                </p>
            </div>
        </div>
    </section>

    <section>
        <h4 class="fw-bold mb-3">
            <i class="bi bi-bag-check text-primary"></i>
            Mis compras
        </h4>

        <div class="card border-0 shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Pedido</th>
                        <th>Fecha y hora</th>
                        <th>Total</th>
                        <th>Estado</th>
                        <th>Boleta</th>
                    </tr>
                    </thead>
                    <tbody id="filasCompras"></tbody>
                </table>

                <p class="text-muted p-3 mb-0 d-none" id="sinCompras">
                    Todavía no tienes compras registradas.
                </p>
            </div>
        </div>
    </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabaseClient.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>

<script src="../js/cliente/mis-solicitudes.js"></script>
</body>
</html>
