<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportar mascota abandonada · MascotICA's</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <link
        rel="stylesheet"
        href="../css/styles.css">

    <script src="../js/theme.js"></script>
</head>

<body>

<div id="navbar"></div>

<div id="alertas"></div>

<div class="container-fluid px-4 pb-5">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">

        <div>
            <h3 class="fw-bold mb-1">
                <i class="bi bi-geo-alt"></i>
                Mascotas abandonadas
            </h3>

            <p class="text-muted mb-0">
                Reporta una mascota encontrada para ayudar a localizar a su familia.
            </p>
        </div>

        <div class="d-flex align-items-center gap-2">

            <span class="badge rounded-pill bg-success">
                <span id="total">0</span> en vivo
            </span>

            <button
                type="button"
                class="btn btn-primary-ps"
                id="btnNuevo">
                <i class="bi bi-plus-circle"></i>
                Nuevo reporte
            </button>

        </div>

    </div>

    <div class="row g-4">

        <div class="col-lg-7">

            <div class="card h-100">

                <div class="card-body p-2">

                    <div
                        id="mapa"
                        style="height: 620px; border-radius: 12px;">
                    </div>

                </div>

            </div>

        </div>

        <div class="col-lg-5">

            <div class="d-flex flex-wrap gap-2 mb-3" id="chips">

                <button
                    type="button"
                    class="btn btn-sm btn-primary"
                    data-filtro="todos">
                    Todos
                </button>

                <button
                    type="button"
                    class="btn btn-sm btn-outline-secondary"
                    data-filtro="abandonada">
                    Abandonadas
                </button>

                <button
                    type="button"
                    class="btn btn-sm btn-outline-secondary"
                    data-filtro="atendida">
                    Atendidas
                </button>

            </div>

            <div id="lista"></div>

        </div>

    </div>

</div>

<div
    class="modal fade"
    id="modalReporte"
    tabindex="-1"
    data-bs-backdrop="static">

    <div class="modal-dialog modal-lg modal-dialog-scrollable">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    <i class="bi bi-plus-circle"></i>
                    Reportar mascota
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <form
                    id="formReporte"
                    novalidate>

                    <div class="mb-3">

                        <label class="form-label">
                            Fotos
                        </label>

                        <input
                            type="file"
                            class="form-control"
                            id="fotos"
                            accept="image/jpeg,image/png"
                            multiple>

                        <div class="form-text">
                            Selecciona de 1 a 3 fotos. Máximo 5 MB por foto.
                        </div>

                        <div
                            id="previewFotos"
                            class="row g-2 mt-2">
                        </div>

                    </div>

                    <div class="row g-3">

                        <div class="col-md-6">

                            <label
                                class="form-label"
                                for="nombre">
                                Nombre o referencia
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="nombre"
                                maxlength="100"
                                required>

                        </div>

                        <div class="col-md-6">

                            <label
                                class="form-label"
                                for="especie">
                                Especie
                            </label>

                            <select
                                class="form-select"
                                id="especie"
                                required>

                                <option value="">
                                    Selecciona...
                                </option>

                                <option value="Perro">
                                    Perro
                                </option>

                                <option value="Gato">
                                    Gato
                                </option>

                            </select>

                        </div>

                    </div>

                    <div class="mb-3 mt-3">

                        <label
                            class="form-label"
                            for="zona">
                            Zona
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="zona"
                            maxlength="150"
                            required>

                    </div>

                    <div class="mb-3">

                        <label
                            class="form-label"
                            for="desc">
                            Descripción
                        </label>

                        <textarea
                            class="form-control"
                            id="desc"
                            rows="4"
                            maxlength="1000"
                            required></textarea>

                    </div>

                    <div class="mb-3">

                        <label
                            class="form-label"
                            for="cNombre">
                            Nombre de contacto
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="cNombre"
                            maxlength="100"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Teléfono de contacto
                        </label>

                        <div class="row g-2">

                            <div class="col-sm-4">

                                <select
                                    class="form-select"
                                    id="cPaisCodigo"
                                    required>

                                    <option value="51" data-iso="PE">
                                        +51 Perú
                                    </option>

                                    <option value="591" data-iso="BO">
                                        +591 Bolivia
                                    </option>

                                    <option value="56" data-iso="CL">
                                        +56 Chile
                                    </option>

                                    <option value="57" data-iso="CO">
                                        +57 Colombia
                                    </option>

                                    <option value="593" data-iso="EC">
                                        +593 Ecuador
                                    </option>

                                    <option value="52" data-iso="MX">
                                        +52 México
                                    </option>

                                    <option value="34" data-iso="ES">
                                        +34 España
                                    </option>

                                    <option value="1" data-iso="US">
                                        +1 Estados Unidos
                                    </option>

                                </select>

                            </div>

                            <div class="col-sm-8">

                                <input
                                    type="tel"
                                    class="form-control"
                                    id="cTel"
                                    inputmode="numeric"
                                    autocomplete="tel"
                                    maxlength="15"
                                    required
                                    placeholder="Número de teléfono">

                            </div>

                        </div>

                        <div class="form-text">
                            Ingresa solamente el número nacional, sin el código de país.
                        </div>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Ubicación
                        </label>

                        <button
                            type="button"
                            class="btn btn-outline-primary w-100 mb-2"
                            id="btnGps">

                            <i class="bi bi-crosshair"></i>
                            Usar mi ubicación

                        </button>

                        <div
                            id="mapaPick"
                            style="height: 300px; border-radius: 12px;">
                        </div>

                        <div class="form-text">
                            También puedes seleccionar directamente un punto en el mapa.
                        </div>

                    </div>

                    <div
                        id="err"
                        class="text-danger fw-bold">
                    </div>

                </form>

            </div>

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">
                    Cancelar
                </button>

                <button
                    type="button"
                    class="btn btn-primary-ps"
                    id="btnPublicar">
                    <i class="bi bi-send"></i>
                    Publicar reporte
                </button>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://cdn.jsdelivr.net/npm/libphonenumber-js@1/bundle/libphonenumber-min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabaseClient.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>

<script>

const usuario = Auth.usuarioActual();

if (!usuario) {
    location.replace('../login.html');
} else {
    iniciar();
}

let mapa = null;
let mapaPick = null;
let marcadorPick = null;

let reportes = [];
let filtroActual = 'todos';

let latSeleccionada = null;
let lngSeleccionada = null;

const modalReporte =
    new bootstrap.Modal(
        document.getElementById('modalReporte')
    );

const iconosEspecie = {
    perro: '🐶',
    gato: '🐱'
};

function iniciar() {

    UI.navbarPerdidas(usuario);

    UI.limpiarAlEscribir(
        '#formReporte'
    );

    crearMapa();

    cargarReportes();

    iniciarRealtime();

    document
        .getElementById('btnNuevo')
        .addEventListener(
            'click',
            abrirNuevoReporte
        );

    document
        .getElementById('btnPublicar')
        .addEventListener(
            'click',
            publicarReporte
        );

    document
        .getElementById('btnGps')
        .addEventListener(
            'click',
            usarUbicacion
        );

    document
        .getElementById('fotos')
        .addEventListener(
            'change',
            revisarFotos
        );

    document
        .getElementById('cTel')
        .addEventListener(
            'input',
            event => {

                event.target.value =
                    event.target.value.replace(
                        /\D/g,
                        ''
                    );

                if (
                    event.target.value.length > 15
                ) {
                    event.target.value =
                        event.target.value.slice(
                            0,
                            15
                        );
                }
            }
        );

    document
        .getElementById('cPaisCodigo')
        .addEventListener(
            'change',
            () => {

                const telefono =
                    document.getElementById(
                        'cTel'
                    );

                telefono.value = '';

                telefono.classList.remove(
                    'is-invalid',
                    'is-valid'
                );
            }
        );

    document
        .querySelectorAll(
            '#chips [data-filtro]'
        )
        .forEach(chip => {

            chip.addEventListener(
                'click',
                () => {

                    filtroActual =
                        chip.dataset.filtro;

                    document
                        .querySelectorAll(
                            '#chips [data-filtro]'
                        )
                        .forEach(item => {

                            const activo =
                                item.dataset.filtro ===
                                filtroActual;

                            item.classList.toggle(
                                'btn-primary',
                                activo
                            );

                            item.classList.toggle(
                                'btn-outline-secondary',
                                !activo
                            );
                        });

                    pintarReportes();
                }
            );
        });
}

function crearMapa() {

    mapa = L.map('mapa').setView(
        [-14.0678, -75.7286],
        13
    );

    L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }
    ).addTo(mapa);
}

async function cargarReportes() {

    const {
        data,
        error
    } = await db
        .from('pet_reports')
        .select('*')
        .order(
            'created_at',
            {
                ascending: false
            }
        );

    if (error) {
        console.error(error);

        UI.setFlash(
            'error',
            'No se pudieron cargar los reportes.'
        );

        UI.mostrarFlash();

        return;
    }

    reportes = data || [];

    pintarReportes();
}

function iniciarRealtime() {

    db.channel('pet_reports_live')
        .on(
            'postgres_changes',
            {
                event: 'INSERT',
                schema: 'public',
                table: 'pet_reports'
            },
            payload => {

                agregarReporte(
                    payload.new
                );
            }
        )
        .on(
            'postgres_changes',
            {
                event: 'UPDATE',
                schema: 'public',
                table: 'pet_reports'
            },
            payload => {

                const indice =
                    reportes.findIndex(
                        reporte =>
                            reporte.id ===
                            payload.new.id
                    );

                if (indice >= 0) {
                    reportes[indice] =
                        payload.new;
                } else {
                    reportes.unshift(
                        payload.new
                    );
                }

                pintarReportes();
            }
        )
        .on(
            'postgres_changes',
            {
                event: 'DELETE',
                schema: 'public',
                table: 'pet_reports'
            },
            payload => {

                reportes =
                    reportes.filter(
                        reporte =>
                            reporte.id !==
                            payload.old.id
                    );

                pintarReportes();
            }
        )
        .subscribe();
}

function agregarReporte(reporte) {

    const existe =
        reportes.some(
            item =>
                item.id ===
                reporte.id
        );

    if (!existe) {
        reportes.unshift(
            reporte
        );
    }

    pintarReportes();
}

function pintarReportes() {

    const lista =
        document.getElementById(
            'lista'
        );

    const visibles =
        reportes.filter(
            reporte => {

                if (
                    filtroActual ===
                    'todos'
                ) {
                    return true;
                }

                return String(
                    reporte.status || ''
                ).toLowerCase() ===
                filtroActual;
            }
        );

    document.getElementById(
        'total'
    ).textContent =
        reportes.length;

    mapa.eachLayer(
        layer => {

            if (
                layer instanceof L.Marker ||
                layer instanceof L.CircleMarker
            ) {
                mapa.removeLayer(
                    layer
                );
            }
        }
    );

    if (visibles.length === 0) {

        lista.innerHTML = `
            <div class="card">
                <div class="card-body text-center py-4">
                    <i class="bi bi-geo-alt fs-1 text-muted"></i>
                    <p class="text-muted mb-0 mt-2">
                        No hay reportes para este filtro.
                    </p>
                </div>
            </div>
        `;

        return;
    }

    lista.innerHTML =
        visibles.map(
            crearTarjetaReporte
        ).join('');

    visibles.forEach(
        reporte => {

            const icono =
                iconosEspecie[
                    String(
                        reporte.species || ''
                    ).toLowerCase()
                ] || '🐾';

            const marker =
                L.marker(
                    [
                        Number(reporte.lat),
                        Number(reporte.lng)
                    ]
                ).addTo(mapa);

            const telefono =
                obtenerTelefonoWhatsApp(
                    reporte
                );

            const whatsapp =
                telefono
                    ? `
                        <a
                            href="https://wa.me/${telefono}"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="btn btn-sm btn-success">
                            <i class="bi bi-whatsapp"></i>
                            WhatsApp
                        </a>
                    `
                    : '';

            marker.bindPopup(`
                <div style="min-width:220px">

                    <strong>
                        ${icono}
                        ${UI.esc(reporte.pet_name)}
                    </strong>

                    <div class="small text-muted mt-1">
                        ${UI.esc(reporte.species)}
                    </div>

                    <div class="small mt-2">
                        ${UI.esc(reporte.zone)}
                    </div>

                    <div class="small mt-2">
                        ${UI.esc(reporte.description)}
                    </div>

                    <div class="small mt-2">
                        <strong>Contacto:</strong>
                        ${UI.esc(reporte.contact_name)}
                    </div>

                    <div class="mt-3">
                        ${whatsapp}
                    </div>

                </div>
            `);
        }
    );
}

function crearTarjetaReporte(reporte) {

    const foto =
        reporte.photo_url_1 ||
        reporte.photo_url_2 ||
        reporte.photo_url_3;

    const estado =
        String(
            reporte.status || ''
        ).toLowerCase();

    const estadoTexto =
        estado === 'atendida'
            ? 'Atendida'
            : 'Abandonada';

    const estadoClase =
        estado === 'atendida'
            ? 'bg-success'
            : 'bg-warning text-dark';

    return `
        <div class="card mb-3">

            <div class="row g-0">

                ${
                    foto
                        ? `
                            <div class="col-4">
                                <img
                                    src="${UI.esc(foto)}"
                                    alt="Foto de ${UI.esc(reporte.pet_name)}"
                                    class="w-100 h-100"
                                    style="object-fit:cover; min-height:150px;">
                            </div>
                        `
                        : ''
                }

                <div class="${
                    foto
                        ? 'col-8'
                        : 'col-12'
                }">

                    <div class="card-body">

                        <div class="d-flex justify-content-between gap-2 mb-2">

                            <h5 class="card-title mb-0">
                                ${UI.esc(reporte.pet_name)}
                            </h5>

                            <span class="badge ${estadoClase}">
                                ${estadoTexto}
                            </span>

                        </div>

                        <p class="text-muted small mb-2">
                            <i class="bi bi-paw"></i>
                            ${UI.esc(reporte.species)}
                        </p>

                        <p class="small mb-2">
                            <i class="bi bi-geo-alt"></i>
                            ${UI.esc(reporte.zone)}
                        </p>

                        <p class="small mb-2">
                            ${UI.esc(reporte.description)}
                        </p>

                        <p class="small text-muted mb-0">
                            <i class="bi bi-person"></i>
                            ${UI.esc(reporte.contact_name)}
                        </p>

                    </div>

                </div>

            </div>

        </div>
    `;
}

function obtenerTelefonoWhatsApp(reporte) {

    const codigo =
        String(
            reporte.contact_phone_country || ''
        ).replace(
            /\D/g,
            ''
        );

    const telefono =
        String(
            reporte.contact_phone || ''
        ).replace(
            /\D/g,
            ''
        );

    if (!codigo || !telefono) {
        return '';
    }

    const completo =
        `${codigo}${telefono}`;

    if (
        completo.length < 8 ||
        completo.length > 15
    ) {
        return '';
    }

    return completo;
}

function abrirNuevoReporte() {

    document
        .getElementById(
            'formReporte'
        )
        .reset();

    document
        .getElementById(
            'previewFotos'
        )
        .innerHTML = '';

    document
        .getElementById(
            'err'
        )
        .textContent = '';

    document
        .querySelectorAll(
            '#formReporte .is-invalid, #formReporte .is-valid'
        )
        .forEach(
            campo => {
                campo.classList.remove(
                    'is-invalid',
                    'is-valid'
                );
            }
        );

    latSeleccionada = null;
    lngSeleccionada = null;

    modalReporte.show();
}

function iniciarMapaPicker() {

    if (mapaPick) {
        mapaPick.invalidateSize();
        return;
    }

    mapaPick =
        L.map('mapaPick').setView(
            [-14.0678, -75.7286],
            13
        );

    L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }
    ).addTo(mapaPick);

    mapaPick.on(
        'click',
        event => {

            seleccionarUbicacion(
                event.latlng.lat,
                event.latlng.lng
            );
        }
    );
}

document
    .getElementById('modalReporte')
    .addEventListener(
        'shown.bs.modal',
        () => {

            iniciarMapaPicker();

            if (
                latSeleccionada !== null &&
                lngSeleccionada !== null
            ) {
                mapaPick.setView(
                    [
                        latSeleccionada,
                        lngSeleccionada
                    ],
                    15
                );
            }

            setTimeout(
                () => {
                    mapaPick.invalidateSize();
                },
                150
            );
        }
    );

function seleccionarUbicacion(
    lat,
    lng
) {

    latSeleccionada =
        Number(lat);

    lngSeleccionada =
        Number(lng);

    if (marcadorPick) {
        mapaPick.removeLayer(
            marcadorPick
        );
    }

    marcadorPick =
        L.marker([
            latSeleccionada,
            lngSeleccionada
        ]).addTo(
            mapaPick
        );

    marcadorPick.bindPopup(
        'Ubicación seleccionada'
    ).openPopup();
}

function usarUbicacion() {

    if (
        !navigator.geolocation
    ) {

        UI.setFlash(
            'error',
            'Tu navegador no permite obtener la ubicación.'
        );

        UI.mostrarFlash();

        return;
    }

    const boton =
        document.getElementById(
            'btnGps'
        );

    boton.disabled = true;

    boton.innerHTML = `
        <span class="spinner-border spinner-border-sm"></span>
        Obteniendo ubicación...
    `;

    navigator.geolocation.getCurrentPosition(
        posicion => {

            seleccionarUbicacion(
                posicion.coords.latitude,
                posicion.coords.longitude
            );

            mapaPick.setView(
                [
                    posicion.coords.latitude,
                    posicion.coords.longitude
                ],
                16
            );

            boton.disabled = false;

            boton.innerHTML = `
                <i class="bi bi-crosshair"></i>
                Usar mi ubicación
            `;
        },
        () => {

            boton.disabled = false;

            boton.innerHTML = `
                <i class="bi bi-crosshair"></i>
                Usar mi ubicación
            `;

            UI.setFlash(
                'error',
                'No se pudo obtener tu ubicación.'
            );

            UI.mostrarFlash();
        },
        {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
        }
    );
}

function revisarFotos() {

    const input =
        document.getElementById(
            'fotos'
        );

    const preview =
        document.getElementById(
            'previewFotos'
        );

    preview.innerHTML = '';

    const archivos =
        Array.from(
            input.files || []
        );

    if (archivos.length > 3) {

        input.value = '';

        UI.setFlash(
            'error',
            'Puedes seleccionar un máximo de 3 fotos.'
        );

        UI.mostrarFlash();

        return;
    }

    for (const archivo of archivos) {

        if (
            ![
                'image/jpeg',
                'image/jpg',
                'image/png'
            ].includes(
                archivo.type
            )
        ) {

            input.value = '';

            UI.setFlash(
                'error',
                'Solo se permiten imágenes JPG, JPEG o PNG.'
            );

            UI.mostrarFlash();

            return;
        }

        if (
            archivo.size >
            5 * 1024 * 1024
        ) {

            input.value = '';

            UI.setFlash(
                'error',
                'Cada foto debe pesar como máximo 5 MB.'
            );

            UI.mostrarFlash();

            return;
        }
    }

    archivos.forEach(
        archivo => {

            const url =
                URL.createObjectURL(
                    archivo
                );

            const col =
                document.createElement(
                    'div'
                );

            col.className =
                'col-4';

            col.innerHTML = `
                <img
                    src="${url}"
                    alt="Vista previa"
                    class="img-fluid rounded"
                    style="height:120px;width:100%;object-fit:cover;">
            `;

            preview.appendChild(
                col
            );
        }
    );
}

function validarTelefono() {

    const pais =
        document.getElementById(
            'cPaisCodigo'
        );

    const opcion =
        pais.options[
            pais.selectedIndex
        ];

    const iso =
        opcion?.dataset?.iso;

    const telefono =
        document.getElementById(
            'cTel'
        );

    const numero =
        telefono.value.trim();

    if (!numero) {
        UI.marcarInvalido(
            telefono,
            true
        );

        return 'Completa el número de teléfono.';
    }

    if (
        numero.length < 4 ||
        numero.length > 15
    ) {

        UI.marcarInvalido(
            telefono,
            true
        );

        return 'El número de teléfono no es válido.';
    }

    try {

        const phone =
            libphonenumber.parsePhoneNumberFromString(
                numero,
                iso
            );

        if (
            !phone ||
            !phone.isValid()
        ) {

            UI.marcarInvalido(
                telefono,
                true
            );

            return 'El número de teléfono no es válido para el país seleccionado.';
        }

    } catch {

        UI.marcarInvalido(
            telefono,
            true
        );

        return 'El número de teléfono no es válido.';
    }

    UI.marcarInvalido(
        telefono,
        false
    );

    return '';
}

async function subirFotos() {

    const input =
        document.getElementById(
            'fotos'
        );

    const archivos =
        Array.from(
            input.files || []
        );

    if (
        archivos.length < 1 ||
        archivos.length > 3
    ) {
        return {
            urls: [],
            error: 'Debes seleccionar entre 1 y 3 fotos.'
        };
    }

    const urls = [];

    for (
        let i = 0;
        i < archivos.length;
        i++
    ) {

        const archivo =
            archivos[i];

        if (
            archivo.size >
            5 * 1024 * 1024
        ) {
            return {
                urls: [],
                error: 'Cada foto debe pesar como máximo 5 MB.'
            };
        }

        const extension =
            archivo.name
                .split('.')
                .pop()
                .toLowerCase();

        const nombre =
            `reportes/${crypto.randomUUID()}-${i + 1}.${extension}`;

        const {
            error
        } = await db.storage
            .from('pet-photos')
            .upload(
                nombre,
                archivo,
                {
                    contentType:
                        archivo.type,
                    upsert: false
                }
            );

        if (error) {

            return {
                urls: [],
                error: 'No se pudo subir una de las fotos.'
            };
        }

        const {
            data
        } = db.storage
            .from('pet-photos')
            .getPublicUrl(
                nombre
            );

        urls.push(
            data.publicUrl
        );
    }

    return {
        urls,
        error: null
    };
}

async function publicarReporte() {

    const err =
        document.getElementById(
            'err'
        );

    err.textContent = '';

    const mensaje =
        UI.validarCampos([
            {
                id: 'fotos',
                etiqueta: 'Fotos'
            },
            {
                id: 'nombre',
                etiqueta: 'Nombre o referencia'
            },
            {
                id: 'especie',
                etiqueta: 'Especie'
            },
            {
                id: 'zona',
                etiqueta: 'Zona'
            },
            {
                id: 'desc',
                etiqueta: 'Descripción'
            },
            {
                id: 'cNombre',
                etiqueta: 'Nombre de contacto'
            },
            {
                id: 'cPaisCodigo',
                etiqueta: 'País'
            },
            {
                id: 'cTel',
                etiqueta: 'Teléfono'
            }
        ]);

    if (mensaje) {

        err.textContent =
            mensaje;

        return;
    }

    const archivos =
        Array.from(
            document.getElementById(
                'fotos'
            ).files || []
        );

    if (
        archivos.length < 1 ||
        archivos.length > 3
    ) {

        UI.marcarInvalido(
            'fotos',
            true
        );

        err.textContent =
            'Debes seleccionar entre 1 y 3 fotos.';

        return;
    }

    if (
        latSeleccionada === null ||
        lngSeleccionada === null
    ) {

        err.textContent =
            'Selecciona la ubicación de la mascota en el mapa.';

        return;
    }

    const errorTelefono =
        validarTelefono();

    if (errorTelefono) {

        err.textContent =
            errorTelefono;

        return;
    }

    const pais =
        document.getElementById(
            'cPaisCodigo'
        ).value;

    const telefono =
        document.getElementById(
            'cTel'
        ).value
        .replace(
            /\D/g,
            ''
        );

    const boton =
        document.getElementById(
            'btnPublicar'
        );

    boton.disabled = true;

    boton.innerHTML = `
        <span class="spinner-border spinner-border-sm"></span>
        Publicando...
    `;

    const resultadoFotos =
        await subirFotos();

    if (resultadoFotos.error) {

        boton.disabled = false;

        boton.innerHTML = `
            <i class="bi bi-send"></i>
            Publicar reporte
        `;

        err.textContent =
            resultadoFotos.error;

        return;
    }

    const urls =
        resultadoFotos.urls;

    const {
        error
    } = await db
        .from('pet_reports')
        .insert({
            user_id: usuario.id,
            pet_name:
                document.getElementById(
                    'nombre'
                ).value.trim(),
            species:
                document.getElementById(
                    'especie'
                ).value,
            status: 'abandonada',
            description:
                document.getElementById(
                    'desc'
                ).value.trim(),
            zone:
                document.getElementById(
                    'zona'
                ).value.trim(),
            lat:
                latSeleccionada,
            lng:
                lngSeleccionada,
            photo_url_1:
                urls[0] || null,
            photo_url_2:
                urls[1] || null,
            photo_url_3:
                urls[2] || null,
            contact_name:
                document.getElementById(
                    'cNombre'
                ).value.trim(),
            contact_phone:
                telefono,
            contact_phone_country:
                pais
        });

    boton.disabled = false;

    boton.innerHTML = `
        <i class="bi bi-send"></i>
        Publicar reporte
    `;

    if (error) {

        console.error(error);

        err.textContent =
            'No se pudo publicar el reporte.';

        return;
    }

    modalReporte.hide();

    UI.setFlash(
        'exito',
        'El reporte fue publicado correctamente.'
    );

    UI.mostrarFlash();

    await cargarReportes();
}
