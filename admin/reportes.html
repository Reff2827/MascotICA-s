<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Reportes · MascotICA's Admin</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet" integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous">

    <link
        href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
        rel="stylesheet" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">

    <link
        rel="stylesheet"
        href="../css/styles.css">

    <script src="../js/theme.js"></script>

</head>


<body>

<div id="navbar"></div>

<div id="alertas"></div>


<main class="container-fluid px-4 pb-5">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">

        <div>

            <h3 class="fw-bold mb-1">

                <i class="bi bi-geo-alt-fill"></i>

                Reportes de mascotas

            </h3>

            <p class="text-muted mb-0">
                Revisa los reportes enviados por los usuarios y actualiza su estado.
            </p>

        </div>


        <div class="d-flex gap-2">

            <button
                type="button"
                class="btn btn-outline-secondary"
                id="btnActualizar">

                <i class="bi bi-arrow-clockwise"></i>

                Actualizar

            </button>

        </div>

    </div>


    <!-- ESTADÍSTICAS -->

    <div class="row g-3 mb-4">

        <div class="col-md-4">

            <div class="card card-stat bg-naranja p-3">

                <div class="d-flex justify-content-between align-items-center">

                    <div>

                        <div class="small">
                            Total de reportes
                        </div>

                        <div
                            class="fs-2 fw-bold"
                            id="statTotal">
                            0
                        </div>

                    </div>

                    <i class="bi bi-geo-alt icon"></i>

                </div>

            </div>

        </div>


        <div class="col-md-4">

            <div class="card card-stat bg-rojo p-3">

                <div class="d-flex justify-content-between align-items-center">

                    <div>

                        <div class="small">
                            Abandonadas
                        </div>

                        <div
                            class="fs-2 fw-bold"
                            id="statAbandonadas">
                            0
                        </div>

                    </div>

                    <i class="bi bi-exclamation-triangle icon"></i>

                </div>

            </div>

        </div>


        <div class="col-md-4">

            <div class="card card-stat bg-verde p-3">

                <div class="d-flex justify-content-between align-items-center">

                    <div>

                        <div class="small">
                            Atendidas
                        </div>

                        <div
                            class="fs-2 fw-bold"
                            id="statAtendidas">
                            0
                        </div>

                    </div>

                    <i class="bi bi-check-circle icon"></i>

                </div>

            </div>

        </div>

    </div>


    <!-- FILTROS -->

    <div class="card border-0 shadow-sm mb-4">

        <div class="card-body">

            <div class="row g-3 align-items-end">

                <div class="col-md-4">

                    <label class="form-label">
                        Buscar
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-search"></i>
                        </span>

                        <input
                            type="search"
                            class="form-control"
                            id="buscar"
                            placeholder="Nombre, zona o contacto...">

                    </div>

                </div>


                <div class="col-md-3">

                    <label class="form-label">
                        Estado
                    </label>

                    <select
                        class="form-select"
                        id="filtroEstado">

                        <option value="todos">
                            Todos
                        </option>

                        <option value="abandonada">
                            Abandonadas
                        </option>

                        <option value="atendida">
                            Atendidas
                        </option>

                    </select>

                </div>


                <div class="col-md-3">

                    <label class="form-label">
                        Especie
                    </label>

                    <select
                        class="form-select"
                        id="filtroEspecie">

                        <option value="todos">
                            Todas
                        </option>

                        <option value="perro">
                            Perros
                        </option>

                        <option value="gato">
                            Gatos
                        </option>

                    </select>

                </div>


                <div class="col-md-2">

                    <div class="text-muted small">
                        Mostrando
                    </div>

                    <strong id="cantidadMostrada">
                        0 reportes
                    </strong>

                </div>

            </div>

        </div>

    </div>


    <!-- REPORTES -->

    <div id="contenedorReportes">

        <div class="text-center py-5">

            <div
                class="spinner-border"
                role="status">
            </div>

            <p class="mt-3 text-muted">
                Cargando reportes...
            </p>

        </div>

    </div>

</main>


<!-- MODAL DETALLE -->

<div
    class="modal fade"
    id="modalDetalle"
    tabindex="-1"
    aria-hidden="true">

    <div class="modal-dialog modal-xl modal-dialog-scrollable">

        <div class="modal-content">

            <div class="modal-header">

                <h5
                    class="modal-title"
                    id="detalleTitulo">
                    Reporte
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Cerrar">
                </button>

            </div>


            <div
                class="modal-body"
                id="detalleContenido">
            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Cerrar

                </button>

            </div>

        </div>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous">
</script>

<script
    src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous">
</script>

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R" crossorigin="anonymous">
</script>

<script src="../js/supabaseClient.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>


<script src="../js/admin/reportes.js"></script>

</body>
</html>
