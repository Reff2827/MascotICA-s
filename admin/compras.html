<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compras · MascotICA's</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/theme.js"></script>
</head>

<body>

<div id="navbar"></div>
<div id="alertas"></div>

<div class="container-fluid px-4 pb-5">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">

        <div>
            <h3 class="fw-bold mb-1">
                <i class="bi bi-bag-check"></i>
                Compras
            </h3>

            <p class="text-muted mb-0">
                Consulta y administra las compras realizadas por los clientes.
            </p>
        </div>

        <button
            type="button"
            class="btn btn-outline-secondary"
            id="btnActualizarCompras">

            <i class="bi bi-arrow-clockwise"></i>
            Actualizar

        </button>

    </div>

    <div
        id="errCompras"
        class="text-danger fw-bold mb-3">
    </div>

    <div class="card shadow-sm border-0">

        <div class="card-body p-0">

            <div class="table-responsive">

                <table class="table table-hover align-middle mb-0">

                    <thead class="table-light">

                        <tr>

                            <th>
                                Número de pedido
                            </th>

                            <th>
                                ID de compra
                            </th>

                            <th>
                                Cliente
                            </th>

                            <th>
                                Fecha
                            </th>

                            <th>
                                Hora
                            </th>

                            <th>
                                Total
                            </th>

                            <th>
                                Estado
                            </th>

                            <th>
                                Boleta
                            </th>

                            <th class="text-center">
                                Detalle
                            </th>

                        </tr>

                    </thead>

                    <tbody id="listaCompras">

                        <tr>

                            <td
                                colspan="9"
                                class="text-center text-muted py-5">

                                <span
                                    class="spinner-border spinner-border-sm me-2">
                                </span>

                                Cargando compras...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<div
    class="modal fade"
    id="modalDetalleCompra"
    tabindex="-1">

    <div class="modal-dialog modal-xl modal-dialog-scrollable">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">

                    <i class="bi bi-receipt"></i>
                    Detalle de compra

                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <div
                    id="errDetalleCompra"
                    class="text-danger fw-bold mb-3">
                </div>

                <div id="contenidoDetalleCompra">

                    <div class="text-center text-muted py-5">

                        <span
                            class="spinner-border spinner-border-sm me-2">
                        </span>

                        Cargando detalle...

                    </div>

                </div>

            </div>

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Cerrar

                </button>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R" crossorigin="anonymous"></script>
<script src="../js/supabaseClient.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>

<script src="../js/admin/compras.js"></script>

</body>
</html>
