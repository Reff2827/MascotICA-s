<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="tituloPagina">Mascota · MascotICA's Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/theme.js"></script>
</head>
<body>
<div id="navbar"></div>

<div class="container-fluid px-4 pb-5">
    <h3 class="fw-bold mb-4">
        <i class="bi bi-heart"></i>
        <span id="tituloForm">Registrar mascota</span>
    </h3>

<div class="card border-0 shadow-sm" style="max-width:600px;">
    <div class="card-body p-4">
        <form id="formMascota">
            <input type="hidden" id="idMascota">

            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" id="nombre" class="form-control"
                       placeholder="Ej: Rocky" required>
                <div class="text-danger small d-none" id="errNombre">
                    El nombre es obligatorio
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Especie</label>
                    <select id="especie" class="form-select" required>
                        <option value="">-- Selecciona --</option>
                        <option value="Perro">Perro</option>
                        <option value="Gato">Gato</option>
                    </select>
                    <div class="text-danger small d-none" id="errEspecie">
                        La especie es obligatoria
                    </div>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Raza / tipo</label>
                    <input type="text" id="raza" class="form-control"
                           placeholder="Ej: Mestizo, Labrador, Siamés..." required>
                    <div class="text-danger small d-none" id="errRaza">
                        La raza o tipo es obligatorio
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Edad</label>
                <input type="text" id="edad" class="form-control"
                       placeholder="Ej: 1 año" required>
                <div class="text-danger small d-none" id="errEdad">
                    La edad es obligatoria
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Estado</label>
                <select id="estado" class="form-select">
                    <option value="DISPONIBLE">DISPONIBLE</option>
                    <option value="EN_PROCESO">EN_PROCESO</option>
                    <option value="ADOPTADO">ADOPTADO</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Imagen de la mascota</label>

                <div class="d-flex gap-2 mb-3">
                    <button type="button" class="btn btn-outline-primary" id="btnUrl">
                        <i class="bi bi-link-45deg"></i> Usar URL
                    </button>

                    <button type="button" class="btn btn-outline-secondary" id="btnArchivo">
                        <i class="bi bi-image"></i> Seleccionar imagen
                    </button>
                </div>

                <div id="contenedorUrl">
                    <input type="text" id="imagenUrl" class="form-control" placeholder="https://...">
                    <small class="text-muted">
                        Ingresa la dirección de una imagen disponible en internet.
                    </small>
                </div>

                <div id="contenedorArchivo" class="d-none">
                    <input type="file" id="imagenArchivo" class="form-control" accept="image/*">
                    <small class="text-muted">
                        La imagen se sube al almacenamiento del proyecto al guardar.
                    </small>
                </div>
            </div>

            <div class="mb-3 d-none" id="contenedorPreview">
                <label class="form-label">Vista previa</label>
                <div class="card border-0 shadow-sm overflow-hidden" style="max-width:250px;">
                    <img id="previewImagen"
                         src=""
                         alt="Vista previa"
                         style="width:100%;height:180px;object-fit:cover;">
                </div>
            </div>

            <div id="estadoSubida" class="mb-3 text-muted small"></div>

            <div class="d-flex gap-2">
                <button type="submit" id="btnGuardar" class="btn btn-primary-ps">
                    <i class="bi bi-save"></i> Guardar
                </button>

                <a href="mascotas.html" class="btn btn-outline-secondary">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabaseClient.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>

<script>
    const usuario = Auth.requireAdmin();

    if (usuario) {
        UI.navbarAdmin(usuario);
        cargarSiEsEdicion();
    }

    async function cargarSiEsEdicion() {
        const id = new URLSearchParams(window.location.search).get('id');

        if (!id) return;

        const mascota = await Mascotas.buscarPorId(id);

        if (!mascota) {
            UI.setFlash('error', 'La mascota indicada no existe.');
            window.location.href = 'mascotas.html';
            return;
        }

        document.getElementById('tituloPagina').textContent =
            "Editar mascota · MascotICA's Admin";

        document.getElementById('tituloForm').textContent =
            'Editar mascota';

        document.getElementById('idMascota').value =
            mascota.idMascota;

        document.getElementById('nombre').value =
            mascota.nombre;

        document.getElementById('especie').value =
            mascota.especie;

        document.getElementById('raza').value =
            mascota.raza || '';

        document.getElementById('edad').value =
            mascota.edad;

        document.getElementById('estado').value =
            mascota.estado;

        document.getElementById('imagenUrl').value =
            mascota.imagenUrl || '';

        if (mascota.imagenUrl) {
            mostrarPreview(mascota.imagenUrl);
        }
    }

    function mostrarPreview(src) {
        const preview = document.getElementById('previewImagen');
        const contenedor = document.getElementById('contenedorPreview');

        preview.src = src;
        contenedor.classList.remove('d-none');
    }

    function ocultarPreview() {
        const preview = document.getElementById('previewImagen');
        const contenedor = document.getElementById('contenedorPreview');

        preview.src = '';
        contenedor.classList.add('d-none');
    }

    document.getElementById('btnUrl').addEventListener('click', function () {
        document.getElementById('contenedorUrl').classList.remove('d-none');
        document.getElementById('contenedorArchivo').classList.add('d-none');

        document.getElementById('imagenArchivo').value = '';

        const url = document.getElementById('imagenUrl').value.trim();

        if (url) {
            mostrarPreview(url);
        } else {
            ocultarPreview();
        }
    });

    document.getElementById('btnArchivo').addEventListener('click', function () {
        document.getElementById('contenedorUrl').classList.add('d-none');
        document.getElementById('contenedorArchivo').classList.remove('d-none');

        document.getElementById('imagenUrl').value = '';
        ocultarPreview();
    });

    document.getElementById('imagenUrl').addEventListener('input', function () {
        const url = this.value.trim();

        if (url) {
            mostrarPreview(url);
        } else {
            ocultarPreview();
        }
    });

    document.getElementById('imagenArchivo').addEventListener('change', function () {
        const archivo = this.files[0];

        if (!archivo) {
            ocultarPreview();
            return;
        }

        if (!archivo.type.startsWith('image/')) {
            alert('Selecciona un archivo de imagen válido.');
            this.value = '';
            ocultarPreview();
            return;
        }

        const lector = new FileReader();

        lector.onload = function (e) {
            mostrarPreview(e.target.result);
        };

        lector.readAsDataURL(archivo);
    });

    document.getElementById('formMascota').addEventListener('submit', async function (e) {
        e.preventDefault();

        const nombre = document.getElementById('nombre').value.trim();
        const especie = document.getElementById('especie').value;
        const raza = document.getElementById('raza').value.trim();
        const edad = document.getElementById('edad').value.trim();

        let valido = true;

        const validarCampo = (idError, condicionError) => {
            const elemento = document.getElementById(idError);

            elemento.classList.toggle('d-none', !condicionError);

            if (condicionError) {
                valido = false;
            }
        };

        validarCampo('errNombre', nombre === '');
        validarCampo('errEspecie', especie === '');
        validarCampo('errRaza', raza === '');
        validarCampo('errEdad', edad === '');

        if (!valido) return;

        const boton = document.getElementById('btnGuardar');
        const estado = document.getElementById('estadoSubida');
        let imagenUrl = document.getElementById('imagenUrl').value.trim();

        const archivo = document.getElementById('imagenArchivo').files[0];

        if (archivo) {
            boton.disabled = true;
            estado.textContent = 'Subiendo imagen...';

            const nombreArchivo = Date.now() + '-' + archivo.name;

            const { error: errorSubida } = await db.storage
                .from('mascotas')
                .upload(nombreArchivo, archivo);

            if (errorSubida) {
                estado.textContent = '';
                boton.disabled = false;
                alert('No se pudo subir la imagen: ' + errorSubida.message);
                return;
            }

            const { data: publica } = db.storage
                .from('mascotas')
                .getPublicUrl(nombreArchivo);

            imagenUrl = publica.publicUrl;
            estado.textContent = '';
        }

        const mascota = {
            idMascota: document.getElementById('idMascota').value || null,
            nombre,
            especie,
            raza,
            edad,
            estado: document.getElementById('estado').value,
            imagenUrl
        };

        await Mascotas.guardar(mascota);

        UI.setFlash('exito', 'Mascota guardada correctamente.');

        window.location.href = 'mascotas.html';
    });
</script>

</body>
</html>
