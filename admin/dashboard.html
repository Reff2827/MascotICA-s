<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Dashboard · MascotICA's Admin</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="../css/styles.css">

    <script src="../js/theme.js"></script>

</head>


<body>

<div id="navbar"></div>

<div id="alertas"></div>


<div class="container-fluid px-4 pb-5">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">

        <h3 class="fw-bold mb-0">

            <i class="bi bi-speedometer2"></i>

            Panel de control

        </h3>

    </div>

    <div class="row g-3 mb-4">

        <div class="col-md-3 col-6">

            <div class="card card-stat bg-naranja p-3">

                <div class="d-flex justify-content-between align-items-center">

                    <div>

                        <div class="small">
                            Mascotas registradas
                        </div>

                        <div
                            class="fs-2 fw-bold"
                            id="statTotalMascotas">
                            0
                        </div>

                    </div>

                    <i class="bi bi-heart icon"></i>

                </div>

            </div>

        </div>


        <div class="col-md-3 col-6">

            <div class="card card-stat bg-verde p-3">

                <div class="d-flex justify-content-between align-items-center">

                    <div>

                        <div class="small">
                            Disponibles / Adoptadas
                        </div>

                        <div
                            class="fs-2 fw-bold"
                            id="statDisponiblesAdoptadas">
                            0 / 0
                        </div>

                    </div>

                    <i class="bi bi-check-circle icon"></i>

                </div>

            </div>

        </div>


        <div class="col-md-3 col-6">

            <div class="card card-stat bg-azul p-3">

                <div class="d-flex justify-content-between align-items-center">

                    <div>

                        <div class="small">
                            Productos en catálogo
                        </div>

                        <div
                            class="fs-2 fw-bold"
                            id="statTotalProductos">
                            0
                        </div>

                    </div>

                    <i class="bi bi-box-seam icon"></i>

                </div>

            </div>

        </div>


        <div class="col-md-3 col-6">

            <div class="card card-stat bg-morado p-3">

                <div class="d-flex justify-content-between align-items-center">

                    <div>

                        <div class="small">
                            Solicitudes pendientes
                        </div>

                        <div
                            class="fs-2 fw-bold"
                            id="statSolicitudesPendientes">
                            0
                        </div>

                    </div>

                    <i class="bi bi-inbox icon"></i>

                </div>

            </div>

        </div>


        <div class="col-md-3 col-6">

            <div class="card card-stat bg-rojo p-3">

                <div class="d-flex justify-content-between align-items-center">

                    <div>

                        <div class="small">
                            Productos con stock bajo
                        </div>

                        <div
                            class="fs-2 fw-bold"
                            id="statStockBajo">
                            0
                        </div>

                    </div>

                    <i class="bi bi-exclamation-triangle-fill icon"></i>

                </div>

            </div>

        </div>


        <!-- NUEVO: REPORTES -->

        <div class="col-md-3 col-6">

            <div class="card card-stat bg-naranja p-3">

                <div class="d-flex justify-content-between align-items-center">

                    <div>

                        <div class="small">
                            Mascotas abandonadas
                        </div>

                        <div
                            class="fs-2 fw-bold"
                            id="statReportesAbandonados">
                            0
                        </div>

                    </div>

                    <i class="bi bi-geo-alt-fill icon"></i>

                </div>

            </div>

        </div>

    </div>


    <!-- BLOQUES -->

    <div class="row g-3">

        <!-- SOLICITUDES -->

        <div class="col-lg-6">

            <div class="card border-0 shadow-sm h-100">

                <div class="card-header bg-white fw-bold d-flex justify-content-between align-items-center">

                    <span>

                        <i class="bi bi-clock-history"></i>

                        Solicitudes pendientes de revisión

                    </span>

                    <a
                        href="solicitudes.html"
                        class="btn btn-sm btn-outline-secondary">

                        Ver todas

                    </a>

                </div>


                <div
                    class="card-body p-0"
                    id="tablaUltimasSolicitudes">
                </div>

            </div>

        </div>


        <!-- STOCK -->

        <div class="col-lg-6">

            <div class="card border-0 shadow-sm h-100">

                <div class="card-header bg-white fw-bold d-flex justify-content-between align-items-center">

                    <span>

                        <i class="bi bi-exclamation-triangle text-danger"></i>

                        Productos con stock bajo

                    </span>

                    <a
                        href="productos.html"
                        class="btn btn-sm btn-outline-secondary">

                        Ver todos

                    </a>

                </div>


                <div
                    class="card-body p-0"
                    id="tablaStockBajo">
                </div>

            </div>

        </div>


        <!-- REPORTES -->

        <div class="col-12">

            <div class="card border-0 shadow-sm">

                <div class="card-header bg-white fw-bold d-flex justify-content-between align-items-center">

                    <span>

                        <i class="bi bi-geo-alt-fill text-danger"></i>

                        Reportes de mascotas abandonadas

                    </span>

                    <a
                        href="reportes.html"
                        class="btn btn-sm btn-outline-secondary">

                        Ver reportes

                    </a>

                </div>


                <div
                    class="card-body"
                    id="resumenReportes">
                </div>

            </div>

        </div>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>

<script src="../js/supabaseClient.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>


<script src="../js/admin/dashboard.js"></script>

</body>
</html>
