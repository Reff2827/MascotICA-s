<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard · MascotICA's Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/theme.js"></script>
</head>
<body>
<div id="navbar"></div>
<div id="alertas"></div>

<div class="container-fluid px-4 pb-5">
    <h3 class="fw-bold mb-4"><i class="bi bi-speedometer2"></i> Panel de control</h3>

    <div class="row g-3 mb-4">
        <div class="col-md-3 col-6">
            <div class="card card-stat bg-naranja p-3">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <div class="small">Mascotas registradas</div>
                        <div class="fs-2 fw-bold" id="statTotalMascotas">0</div>
                    </div>
                    <i class="bi bi-heart icon"></i>
                </div>
            </div>
        </div>
        <div class="col-md-3 col-6">
            <div class="card card-stat bg-verde p-3">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <div class="small">Disponibles / Adoptadas</div>
                        <div class="fs-2 fw-bold" id="statDisponiblesAdoptadas">0 / 0</div>
                    </div>
                    <i class="bi bi-check-circle icon"></i>
                </div>
            </div>
        </div>
        <div class="col-md-3 col-6">
            <div class="card card-stat bg-azul p-3">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <div class="small">Productos en catalogo</div>
                        <div class="fs-2 fw-bold" id="statTotalProductos">0</div>
                    </div>
                    <i class="bi bi-box-seam icon"></i>
                </div>
            </div>
        </div>
        <div class="col-md-3 col-6">
            <div class="card card-stat bg-morado p-3">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <div class="small">Solicitudes pendientes</div>
                        <div class="fs-2 fw-bold" id="statSolicitudesPendientes">0</div>
                    </div>
                    <i class="bi bi-inbox icon"></i>
                </div>
            </div>
        </div>
        <div class="col-md-3 col-6">
            <div class="card card-stat p-3" style="background-color:#ffe0e0;">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <div class="small">Productos con stock bajo</div>
                        <div class="fs-2 fw-bold text-danger" id="statStockBajo">0</div>
                    </div>
                    <i class="bi bi-exclamation-triangle-fill icon text-danger"></i>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header bg-white fw-bold d-flex justify-content-between align-items-center">
                    <span><i class="bi bi-clock-history"></i> Solicitudes pendientes de revision</span>
                    <a href="solicitudes.html" class="btn btn-sm btn-outline-secondary">Ver todas</a>
                </div>
                <div class="card-body p-0" id="tablaUltimasSolicitudes"></div>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header bg-white fw-bold d-flex justify-content-between align-items-center">
                    <span><i class="bi bi-exclamation-triangle text-danger"></i> Productos con stock bajo</span>
                    <a href="productos.html" class="btn btn-sm btn-outline-secondary">Ver todos</a>
                </div>
                <div class="card-body p-0" id="tablaStockBajo"></div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabaseClient.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script>
    const usuario = Auth.requireAdmin();
    const UMBRAL_STOCK_BAJO = 5;

    if (usuario) {
        UI.navbarAdmin(usuario);
        UI.mostrarFlash();
        cargarDashboard();
    }

    async function cargarDashboard() {
        const [mascotas, productos, pendientes, stockBajo] = await Promise.all([
            Mascotas.listar(),
            Productos.listar(),
            Solicitudes.listarPorEstado('PENDIENTE'),
            Productos.listarStockBajo(UMBRAL_STOCK_BAJO)
        ]);

        const disponibles = mascotas.filter(m => m.estado === 'DISPONIBLE').length;
        const adoptadas = mascotas.filter(m => m.estado === 'ADOPTADO').length;

        document.getElementById('statTotalMascotas').textContent = mascotas.length;
        document.getElementById('statDisponiblesAdoptadas').textContent = `${disponibles} / ${adoptadas}`;
        document.getElementById('statTotalProductos').textContent = productos.length;
        document.getElementById('statSolicitudesPendientes').textContent = pendientes.length;
        document.getElementById('statStockBajo').textContent = stockBajo.length;

        const contSolicitudes = document.getElementById('tablaUltimasSolicitudes');
        if (pendientes.length === 0) {
            contSolicitudes.innerHTML = `<p class="text-muted p-3 mb-0">No hay solicitudes pendientes por el momento.</p>`;
        } else {
            const filas = pendientes.map(s => `
                <tr>
                    <td>${s.idSolicitud}</td>
                    <td>${s.tipo === 'ADOPCION'
                        ? '<i class="bi bi-heart-fill text-danger"></i> Adopcion'
                        : '<i class="bi bi-cart-fill text-primary"></i> Compra'}</td>
                    <td>${UI.formatoFecha(s.fecha)}</td>
                    <td><span class="badge badge-estado-${s.estado}">${s.estado}</span></td>
                    <td class="text-end"><a href="solicitudes.html" class="btn btn-sm btn-outline-primary">Revisar</a></td>
                </tr>`).join('');

            contSolicitudes.innerHTML = `
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr><th>#</th><th>Tipo</th><th>Fecha</th><th>Estado</th><th class="text-end">Accion</th></tr>
                    </thead>
                    <tbody>${filas}</tbody>
                </table>`;
        }

        const contStock = document.getElementById('tablaStockBajo');
        if (stockBajo.length === 0) {
            contStock.innerHTML = `<p class="text-muted p-3 mb-0">Todos los productos tienen stock suficiente.</p>`;
        } else {
            const filasStock = stockBajo.map(p => `
                <tr>
                    <td>${UI.esc(p.nombre)}</td>
                    <td>${p.categoria}</td>
                    <td class="text-end">
                        <span class="badge ${p.stock === 0 ? 'bg-danger' : 'bg-warning text-dark'}">
                            ${p.stock === 0 ? 'Agotado' : p.stock + ' unid.'}
                        </span>
                    </td>
                </tr>`).join('');

            contStock.innerHTML = `
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr><th>Producto</th><th>Categoria</th><th class="text-end">Stock</th></tr>
                    </thead>
                    <tbody>${filasStock}</tbody>
                </table>`;
        }
    }
</script>
</body>
</html>
