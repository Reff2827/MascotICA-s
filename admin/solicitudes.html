<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitudes · MascotICA's Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<div id="navbar"></div>
<div id="alertas"></div>

<div class="container-fluid px-4 pb-5">
    <h3 class="fw-bold mb-3"><i class="bi bi-inbox"></i> Solicitudes de adopcion y compra</h3>

    <div class="mb-3">
        <div class="btn-group" id="filtroEstado"></div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>#</th><th>Tipo</th><th>Detalle</th><th>Solicitante</th>
                    <th>Cantidad</th><th>Fecha</th><th>Estado</th><th class="text-end">Accion</th>
                </tr>
                </thead>
                <tbody id="filasSolicitudes"></tbody>
            </table>
            <p class="text-muted p-3 mb-0 d-none" id="sinSolicitudes">No hay solicitudes con ese filtro.</p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script>
    const usuario = Auth.requireAdmin();
    const ESTADOS = ['PENDIENTE', 'APROBADA', 'RECHAZADA'];

    if (usuario) {
        UI.navbarAdmin(usuario);
        UI.mostrarFlash();
        pintarFiltro();
        pintarTabla();
    }

    function filtroActivo() {
        return new URLSearchParams(window.location.search).get('estado');
    }

    function pintarFiltro() {
        const activo = filtroActivo();
        const botones = [`<a href="solicitudes.html" class="btn btn-sm ${!activo ? 'btn-dark' : 'btn-outline-dark'}">Todas</a>`]
            .concat(ESTADOS.map(e => `<a href="solicitudes.html?estado=${e}" class="btn btn-sm ${activo === e ? 'btn-dark' : 'btn-outline-dark'}">${e}</a>`));
        document.getElementById('filtroEstado').innerHTML = botones.join('');
    }

    function pintarTabla() {
        const activo = filtroActivo();
        const solicitudes = activo ? Solicitudes.listarPorEstado(activo) : Solicitudes.listar();
        const tbody = document.getElementById('filasSolicitudes');
        document.getElementById('sinSolicitudes').classList.toggle('d-none', solicitudes.length > 0);

        tbody.innerHTML = solicitudes.map(s => `
            <tr>
                <td>${s.idSolicitud}</td>
                <td>${s.tipo === 'ADOPCION'
                    ? '<span class="text-danger"><i class="bi bi-heart-fill"></i> Adopcion</span>'
                    : '<span class="text-primary"><i class="bi bi-cart-fill"></i> Compra</span>'}</td>
                <td>${UI.esc(Solicitudes.descripcion(s))}</td>
                <td>${UI.esc(s.nombreUsuario)}</td>
                <td>${s.cantidad}</td>
                <td>${UI.formatoFecha(s.fecha)}</td>
                <td><span class="badge badge-estado-${s.estado}">${s.estado}</span></td>
                <td class="text-end">
                    ${s.estado === 'PENDIENTE' ? `
                        <div class="d-flex gap-1 justify-content-end">
                            <button class="btn btn-sm btn-success" data-id="${s.idSolicitud}" data-action="aprobar"><i class="bi bi-check-lg"></i> Aprobar</button>
                            <button class="btn btn-sm btn-outline-danger" data-id="${s.idSolicitud}" data-action="rechazar"><i class="bi bi-x-lg"></i> Rechazar</button>
                        </div>` : `<span class="text-muted small">Procesada</span>`}
                </td>
            </tr>`).join('');

        tbody.querySelectorAll('[data-action="aprobar"]').forEach(btn => {
            btn.addEventListener('click', () => {
                const error = Solicitudes.aprobar(btn.dataset.id);
                UI.setFlash(error ? 'error' : 'exito', error || 'Solicitud aprobada.');
                window.location.reload();
            });
        });
        tbody.querySelectorAll('[data-action="rechazar"]').forEach(btn => {
            btn.addEventListener('click', () => {
                const error = Solicitudes.rechazar(btn.dataset.id);
                UI.setFlash(error ? 'error' : 'exito', error || 'Solicitud rechazada.');
                window.location.reload();
            });
        });
    }
</script>
</body>
</html>
